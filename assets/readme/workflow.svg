<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370" role="img" aria-labelledby="title desc">
  <title>call-agy Architecture and Task Delegation Flow</title>
  <desc>Visual workflow showing how a calling AI Agent delegates bounded tasks to the official Google Antigravity CLI via call-agy, receiving a structured Markdown handoff and resumable conversation ID.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242c" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#d2a8ff" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" />
      <stop offset="100%" stop-color="#ffa657" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, sans-serif; font-size: 13px; fill: #8b949e; font-weight: 500; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, sans-serif; font-size: 14px; font-weight: 600; }
    .card-role { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #8b949e; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, sans-serif; font-size: 12px; fill: #c9d1d9; line-height: 1.4; }
    .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #79c0ff; }
    .badge-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; font-weight: 600; }
    .flow-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #8b949e; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, sans-serif; font-size: 12px; fill: #8b949e; }
  </style>

  <!-- Container Frame -->
  <rect x="2" y="2" width="936" height="366" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Window Header -->
  <path d="M 2 14 Q 2 2 14 2 L 926 2 Q 938 2 938 14 L 938 38 L 2 38 Z" fill="#161b22" />
  <line x1="2" y1="38" x2="938" y2="38" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="20" r="5" fill="#f85149" />
  <circle cx="36" cy="20" r="5" fill="#e3b341" />
  <circle cx="52" cy="20" r="5" fill="#3fb950" />
  <text x="75" y="24" class="title-text">call-agy :: Architecture &amp; Task Delegation Lifecycle</text>

  <!-- STEP 1: Calling Agent -->
  <g filter="url(#shadow)">
    <rect x="24" y="58" width="195" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    <rect x="24" y="58" width="195" height="4" rx="2" fill="url(#blueGrad)" />
    
    <text x="40" y="85" fill="#58a6ff" class="card-title">1. Calling Agent</text>
    <text x="40" y="103" class="card-role">HOST ORCHESTRATOR</text>
    <line x1="40" y1="113" x2="203" y2="113" stroke="#30363d" stroke-width="1" />
    
    <text x="40" y="135" class="card-body">Formulates bounded task:</text>
    <text x="40" y="153" class="code-text">• Concrete goal</text>
    <text x="40" y="171" class="code-text">• Acceptance criteria</text>
    <text x="40" y="189" class="code-text">• Priority --file paths</text>
    <text x="40" y="207" class="code-text">• Safety &amp; workspace</text>

    <rect x="40" y="235" width="163" height="36" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="48" y="257" fill="#8b949e" class="badge-text">STATUS: DELEGATING</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 219 173 L 253 173" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrowBlue)" />

  <!-- STEP 2: call-agy Wrapper -->
  <g filter="url(#shadow)">
    <rect x="257" y="58" width="195" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    <rect x="257" y="58" width="195" height="4" rx="2" fill="url(#purpleGrad)" />

    <text x="273" y="85" fill="#bc8cff" class="card-title">2. call-agy Wrapper</text>
    <text x="273" y="103" class="card-role">CLI PROTOCOL BRIDGE</text>
    <line x1="273" y1="113" x2="436" y2="113" stroke="#30363d" stroke-width="1" />

    <text x="273" y="135" class="card-body">Execution &amp; Safety:</text>
    <text x="273" y="153" class="code-text">• Zero token/secret leak</text>
    <text x="273" y="171" class="code-text">• Cross-platform wrapper</text>
    <text x="273" y="189" class="code-text">• --mode accept-edits</text>
    <text x="273" y="207" class="code-text">• Parses stream-json</text>

    <rect x="273" y="235" width="163" height="36" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="281" y="257" fill="#bc8cff" class="badge-text">HEADLESS INTERFACE</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 452 173 L 486 173" stroke="#bc8cff" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- STEP 3: Official Antigravity CLI -->
  <g filter="url(#shadow)">
    <rect x="490" y="58" width="195" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    <rect x="490" y="58" width="195" height="4" rx="2" fill="url(#greenGrad)" />

    <text x="506" y="85" fill="#3fb950" class="card-title">3. Antigravity CLI</text>
    <text x="506" y="103" class="card-role">OFFICIAL agy ENGINE</text>
    <line x1="506" y1="113" x2="669" y2="113" stroke="#30363d" stroke-width="1" />

    <text x="506" y="135" class="card-body">Autonomous Execution:</text>
    <text x="506" y="153" class="code-text">• Codebase exploration</text>
    <text x="506" y="171" class="code-text">• Implement &amp; debug</text>
    <text x="506" y="189" class="code-text">• Test &amp; lint verification</text>
    <text x="506" y="207" class="code-text">• Local permission rules</text>

    <rect x="506" y="235" width="163" height="36" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="514" y="257" fill="#3fb950" class="badge-text">STATUS: SUCCESS</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 685 173 L 719 173" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowGreen)" />

  <!-- STEP 4: Markdown Handoff -->
  <g filter="url(#shadow)">
    <rect x="723" y="58" width="195" height="230" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" />
    <rect x="723" y="58" width="195" height="4" rx="2" fill="url(#orangeGrad)" />

    <text x="739" y="85" fill="#f0883e" class="card-title">4. Markdown Handoff</text>
    <text x="739" y="103" class="card-role">STRUCTURED RESULT</text>
    <line x1="739" y1="113" x2="902" y2="113" stroke="#30363d" stroke-width="1" />

    <text x="739" y="135" class="card-body">Compact Delivery:</text>
    <text x="739" y="153" class="code-text">• Final response &amp; diff</text>
    <text x="739" y="171" class="code-text">• conversation_id</text>
    <text x="739" y="189" class="code-text">• Tool counts &amp; usage</text>
    <text x="739" y="207" class="code-text">• Host reviews workspace</text>

    <rect x="739" y="235" width="163" height="36" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="747" y="257" fill="#f0883e" class="badge-text">RESUMABLE SESSION</text>
  </g>

  <!-- Bottom Return Loop / Footer Note -->
  <g>
    <path d="M 820 295 L 820 320 L 121 320 L 121 295" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 4" />
    <rect x="290" y="308" width="360" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="310" y="324" class="footer-text">Seamless multi-turn follow-up: <tspan class="code-text" fill="#58a6ff">--conversation &lt;id&gt;</tspan></text>
  </g>
</svg>
